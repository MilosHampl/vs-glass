# Glass Material Renderer CI/CD Pipeline
# GitHub Actions workflow for building and testing glass rendering engine

name: Glass Renderer Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'samples/**'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0' # Weekly build

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: glass-renderer

# Define reusable configuration with YAML anchors
defaults: &defaults
  runs-on: ubuntu-latest
  timeout-minutes: 30

compile_defaults: &compile_defaults
  <<: *defaults
  strategy:
    matrix:
      node-version: [18.x, 20.x]
      python-version: ["3.10", "3.11", "3.12"]
      rust-version: [stable, nightly]

jobs:
  typecheck:
    <<: *compile_defaults
    name: Type Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run type-check

  lint:
    <<: *defaults
    name: Lint Code
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Lint Python
        run: |
          pip install ruff pylint
          ruff check .
          pylint src/

      - name: Lint TypeScript
        run: npx eslint 'src/**/*.ts' --max-warnings 0

  test:
    <<: *compile_defaults
    name: Test Suite
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchains
        run: |
          rustup update ${{ matrix.rust-version }}
          rustup default ${{ matrix.rust-version }}

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust tests
        run: cargo test --release

      - name: Run Python tests
        run: |
          pip install pytest pytest-cov
          pytest tests/ --cov=src/optics --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    <<: *defaults
    name: Build Artifacts
    needs: test
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          npm run build
          cargo build --release

      - name: Create distribution
        run: |
          mkdir -p dist
          cp -r target/release/glass dist/
          cp -r build/ dist/web/
          zip -r glass-renderer-${{ github.ref_name }}.zip dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: glass-renderer
          path: dist/
          retention-days: 30

  docker:
    <<: *defaults
    name: Docker Build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  release:
    <<: *defaults
    name: Create Release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: glass-renderer

      - name: Create release notes
        run: |
          echo "# Glass Renderer ${{ github.ref_name }}" > RELEASE.md
          echo "" >> RELEASE.md
          echo "### Changes" >> RELEASE.md
          git log --oneline ${{ github.event.before }}..${{ github.sha }} >> RELEASE.md

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body_path: RELEASE.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

# Conditional job based on environment
  notify:
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, lint, test, build]
    steps:
      - name: Notification status
        run: |
          echo "Pipeline status: ${{ job.status }}"
          if [ "${{ job.status }}" = "success" ]; then
            echo "All checks passed!"
          else
            echo "Pipeline failed - check logs above"
          fi

# Multi-line string examples with different block styles
  documentation:
    <<: *defaults
    name: Update Docs
    steps:
      - uses: actions/checkout@v4

      - name: Generate API docs
        run: |
          cat > docs/pipeline-info.md << 'EOF'
          # Pipeline Documentation

          This is a folded block scalar with automatic newline handling.
          It provides clear documentation formatting without explicit
          newline characters in the source.

          Key features:
          - Type checking with TypeScript
          - Linting and code quality
          - Comprehensive test suite
          - Automated Docker builds
          - Release management
          EOF
